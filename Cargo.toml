[package]
name = "drivemerge"
version = "0.3.0"
edition = "2021"
description = "age PRO"

[dependencies]
anyhow = "1"
blake3 = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
jwalk = "0.8"
rayon = "1"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false